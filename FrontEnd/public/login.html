<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UTFlix — Login</title>
  <link rel="stylesheet" href="./css/reset.css" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <main class="login">
    <form id="loginForm" class="form login__form" novalidate aria-describedby="formError">
      <h1 class="logo login__logo"><span class="logo__mark">UT</span>Flix</h1>

      <label>
        <span class="visually-hidden">E-mail</span>
        <input id="email" class="input" type="email" placeholder="Seu e-mail" required autocomplete="email" />
      </label>

      <label>
        <span class="visually-hidden">Nome (opcional)</span>
        <input id="name" class="input" type="text" placeholder="Seu nome (opcional)" autocomplete="name" />
      </label>

      <button class="btn btn--login" type="submit">Entrar</button>

      <p id="formError" class="form__error" role="status" aria-live="polite"></p>

      <a id="asGuest" href="#" class="btn btn--ghost login__guest">Continuar como convidado</a>

      <p class="login__hint">Dica: esta tela salva um token fake no localStorage e redireciona para a Home.</p>
    </form>
  </main>
  <script type="module" src="./login.js"></script>
</body>
</html>
