<!doctype html>
<html lang="pt-BR">

  <link rel="stylesheet" href="./css/reset.css" />

</head>
<body>

    <div id="row1"></div>
    <div id="row2"></div>
    <div id="row3"></div>

    <div id="row5"></div>

    <p>© UTFlix — Projeto demo estático. Cores escuras e acessibilidade com foco visível.</p>
  </footer>

  <script type="module" src="./index.js"></script>
