services:
  db:
    image: postgres:14-alpine
    container_name: UTFlix-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: minhaapi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d minhaapi -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  cliente-service:
    build: ./cliente-service
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Schema 'cliente'
      DATABASE_URL: "postgresql://admin:admin@db:5432/minhaapi?schema=cliente"
    command: sh -c "npx prisma migrate dev && npm run dev"

  filmes-service:
    build: ./filmes-service
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Schema 'filmes'
      DATABASE_URL: "postgresql://admin:admin@db:5432/minhaapi?schema=filmes"
    # Adicionando um delay para robustez na inicialização
    command: sh -c "sleep 10 && npx prisma migrate dev && npm run dev"

  pagamento-service:
    build: ./pagamento-service
    ports:
      - "3002:3002"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Schema 'pagamento'
      DATABASE_URL: "postgresql://admin:admin@db:5432/minhaapi?schema=pagamento"
    # Adicionando um delay para robustez na inicialização
    command: sh -c "sleep 10 && npx prisma migrate deploy && npm run dev"

volumes:
  pgdata: